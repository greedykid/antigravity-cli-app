name: CodexRemote
options:
  bundleIdPrefix: com.greedykid
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    AD_HOC_CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGN_STYLE: "Manual"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_BITCODE: "NO"

targets:
  CodexRemote:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CodexRemote
        excludes:
          - "**/Info.plist"
    info:
      path: CodexRemote/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greedykid.codexremote
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        AD_HOC_CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_STYLE: "Manual"
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""


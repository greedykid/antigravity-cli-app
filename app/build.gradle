plugins { id 'com.android.application' }

def getGitSha = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception ignored) {
        return ""
    }
}

android {
    namespace 'com.greedykid.codexremote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.greedykid.codexremote'
        minSdk 26
        targetSdk 35
        versionCode System.getenv("GITHUB_RUN_NUMBER") ? Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER")) + 10 : 2
        versionName '0.3.0'
        buildConfigField "String", "GIT_COMMIT_SHA", "\"${System.getenv("GITHUB_SHA") ?: getGitSha()}\""
        buildConfigField "long", "BUILD_TIMESTAMP", "${System.currentTimeMillis()}L"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.5.0'
    implementation 'com.google.zxing:core:3.5.3'
    // FileProvider: a transcript can be megabytes, far past what an Intent
    // extra can carry, so exports are shared as a content:// file instead.
    implementation 'androidx.core:core:1.13.1'
}

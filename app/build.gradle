plugins { id 'com.android.application' }

def getGitSha = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception ignored) {
        return ""
    }
}

android {
    namespace 'com.greedykid.codexremote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.greedykid.codexremote'
        minSdk 26
        targetSdk 35
        versionCode System.getenv("GITHUB_RUN_NUMBER") ? Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER")) + 10 : 2
        versionName '0.3.0'
        buildConfigField "String", "GIT_COMMIT_SHA", "\"${System.getenv("GITHUB_SHA") ?: getGitSha()}\""
        buildConfigField "long", "BUILD_TIMESTAMP", "${System.currentTimeMillis()}L"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.biometric
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") { because "kotlin-stdlib 1.8 merged jdk7" }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") { because "kotlin-stdlib 1.8 merged jdk8" }
    }
    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.espresso.core
    implementation libs.zxing.core
    // FileProvider: a transcript can be megabytes, far past what an Intent
    // extra can carry, so exports are shared as a content:// file instead.
    implementation 'androidx.core:core:1.13.1'
}

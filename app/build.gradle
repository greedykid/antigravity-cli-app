plugins { id 'com.android.application' }

android {
    namespace 'com.greedykid.codexremote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.greedykid.codexremote'
        minSdk 26
        targetSdk 35
        versionCode System.getenv("GITHUB_RUN_NUMBER") ? Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER")) + 10 : 2
        versionName '0.2.0'
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'codexremote2026'
            keyAlias 'codexremote'
            keyPassword 'codexremote2026'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}


name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: agy-linux-amd64
          - goos: linux
            goarch: arm64
            output: agy-linux-arm64
          - goos: darwin
            goarch: amd64
            output: agy-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: agy-darwin-arm64
          - goos: windows
            goarch: amd64
            output: agy-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Binary (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/${{ matrix.output }} ./cmd/agy

      - name: Create Archive
        run: |
          cd dist
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            zip -j "${{ matrix.output }}.zip" "${{ matrix.output }}"
          else
            tar -czvf "${{ matrix.output }}.tar.gz" "${{ matrix.output }}"
          fi

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true

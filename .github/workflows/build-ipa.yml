name: Build IPA

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # iOS builds need a real macOS toolchain; GitHub's macOS runners are free
    # for public repositories.
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Install XcodeGen
        run: |
          curl -sL https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip -o xcodegen.zip
          unzip -q xcodegen.zip
          sudo cp xcodegen/bin/xcodegen /usr/local/bin/
          sudo mkdir -p /usr/local/share/xcodegen
          sudo cp -R xcodegen/share/xcodegen/* /usr/local/share/xcodegen/ || true
          xcodegen --version

      - name: Resolve version
        id: version
        run: |
          # Android's versionName is the single product version; the iOS
          # marketing version follows it instead of being maintained separately.
          # BSD grep on the macOS runner has no -P, so use a sed expression
          # that works on both platforms.
          VERSION=$(sed -n "s/.*versionName[[:space:]]*'\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read versionName from app/build.gradle"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Product version: $VERSION"

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate --spec project.yml
          ls -la CodexRemote.xcodeproj

      - name: Build unsigned app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project CodexRemote.xcodeproj \
            -scheme CodexRemote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            MARKETING_VERSION=${{ steps.version.outputs.value }} \
            build

      # Package unsigned IPA by wrapping the .app into Payload/ directory
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -e
          APP_PATH=$(find build -name "CodexRemote.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::App bundle not found"
            find build -maxdepth 6 || true
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          rm -rf build/Payload build/CodexRemote.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -qry CodexRemote.ipa Payload
          echo "Built $(du -h CodexRemote.ipa | cut -f1) unsigned IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: codex-remote-unsigned-ipa
          path: ios/build/CodexRemote.ipa
          if-no-files-found: error

      - name: Create Direct IPA Release
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Antigravity Remote Latest Release"
          body: |
            Build otomatis dari commit ${{ github.sha }}.

            * `app-debug.apk` — Android, sudah ditandatangani debug key, bisa langsung dipasang.
            * `CodexRemote.ipa` — iOS, **belum ditandatangani**: pasang lewat AltStore/Sideloadly atau tanda tangani sendiri.
          files: ios/build/CodexRemote.ipa
          overwrite: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

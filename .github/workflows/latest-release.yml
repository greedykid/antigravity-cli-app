name: Automated Latest Release (with APK & Binaries)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Multi-Arch, Android APK, and Deploy Latest Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle (Fixed 8.5)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build Native Android APK
        run: |
          gradle -p android assembleDebug
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/antigravity-ai.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download & Tidy Dependencies
        run: |
          go mod tidy

      - name: Install NFPM Packager
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build Binaries (Linux, macOS, Windows, Android CLI)
        run: |
          # Linux AMD64 & ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/agy-linux-amd64 ./cmd/agy
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/agy-linux-arm64 ./cmd/agy

          # Darwin / macOS
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/agy-darwin-amd64 ./cmd/agy
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/agy-darwin-arm64 ./cmd/agy

          # Windows AMD64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/agy-windows-amd64.exe ./cmd/agy

          # Android CLI Binary (Termux)
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o dist/agy-android-arm64 ./cmd/agy

      - name: Package Debian DEB & Alpine APK via NFPM
        run: |
          nfpm package --config nfpm.yaml --packager apk --target dist/
          nfpm package --config nfpm.yaml --packager deb --target dist/

      - name: Create Archives
        run: |
          cd dist
          tar -czvf agy-linux-amd64.tar.gz agy-linux-amd64
          tar -czvf agy-linux-arm64.tar.gz agy-linux-arm64
          tar -czvf agy-darwin-amd64.tar.gz agy-darwin-amd64
          tar -czvf agy-darwin-arm64.tar.gz agy-darwin-arm64
          zip agy-windows-amd64.zip agy-windows-amd64.exe
          tar -czvf agy-android-arm64.tar.gz agy-android-arm64

      - name: Tag and Update 'latest' Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin latest --force || true

      - name: Publish to GitHub Releases (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Antigravity CLI & Android App - Latest Build"
          body: |
            ## 🚀 Automated Latest Release
            
            ### 📱 Android Application:
            - **`antigravity-ai.apk`** / **`app-debug.apk`**: Native Android APK yang dapat langsung di-install di HP Android (kompatibel Android 7.0 s/d Android 14+).
            
            ### 💻 Desktop & Server Binaries:
            - **Linux**: `agy-linux-amd64.tar.gz` / `agy-linux-arm64.tar.gz`
            - **Debian / Ubuntu**: `antigravity-cli-app_1.0.0_amd64.deb`
            - **macOS**: `agy-darwin-arm64.tar.gz` (M-series) / `agy-darwin-amd64.tar.gz` (Intel)
            - **Windows**: `agy-windows-amd64.zip`
            - **Termux Android Shell**: `agy-android-arm64.tar.gz`
          files: |
            dist/*.apk
            dist/*.deb
            dist/*.tar.gz
            dist/*.zip
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

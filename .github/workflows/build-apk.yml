name: Build APK

on:
  push:
    branches: [main]
    # iOS-only changes have their own workflow; no need to rebuild the APK.
    paths-ignore:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install bridge dependencies
        run: npm install --prefix bridge --no-audit --no-fund
      - name: Run bridge test suite
        run: npm test --prefix bridge

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Resolve version
        id: version
        run: |
          VERSION=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Product version: $VERSION"

      - name: Build debug APK
        run: |
          # Without pipefail a pipeline reports tee's exit status, so a failed
          # Gradle build looked like a success and the only symptom was the
          # artifact step finding no APK.
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee /tmp/gradle_out.log || {
            ERR=$(grep -A 5 "error:" /tmp/gradle_out.log | head -n 30 | tr '\n' ' ' | cut -c 1-500)
            if [ -z "$ERR" ]; then
              ERR=$(tail -n 20 /tmp/gradle_out.log | tr '\n' ' ' | cut -c 1-500)
            fi
            echo "::error title=Gradle Error::$ERR"
            exit 1
          }
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-remote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          # A missing APK is a failed build, not a warning to scroll past.
          if-no-files-found: error
      - name: Create Direct APK Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: "Antigravity Remote v${{ steps.version.outputs.value }}"
          body: |
            Build otomatis dari commit ${{ github.sha }}.

            * `app-debug.apk` — Android, sudah ditandatangani debug key, bisa langsung dipasang.
            * `CodexRemote.ipa` — iOS, **belum ditandatangani**: pasang lewat AltStore/Sideloadly atau tanda tangani sendiri.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

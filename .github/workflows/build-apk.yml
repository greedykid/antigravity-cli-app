name: Build APK

on:
  push:
    branches: [main]
    # iOS-only changes have their own workflow; no need to rebuild the APK.
    paths-ignore:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install bridge dependencies
        run: npm install --prefix bridge --no-audit --no-fund
      - name: Run bridge test suite
        run: npm test --prefix bridge

  build:
    needs: bridge-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: |
          gradle --no-daemon assembleDebug 2>&1 | tee /tmp/gradle_out.log || {
            ERR=$(grep -A 5 "error:" /tmp/gradle_out.log | head -n 30 | tr '\n' ' ' | cut -c 1-500)
            if [ -z "$ERR" ]; then
              ERR=$(tail -n 20 /tmp/gradle_out.log | tr '\n' ' ' | cut -c 1-500)
            fi
            echo "::error title=Gradle Error::$ERR"
            exit 1
          }
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-remote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Create Direct APK Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Antigravity Remote Latest APK"
          body: "Unduh file APK langsung tanpa perlu ekstrak ZIP."
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
